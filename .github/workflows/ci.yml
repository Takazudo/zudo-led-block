# Credential-free validation for every PR and main push, plus a default-off
# production deploy gated on the repository variable CLOUDFLARE_DEPLOY_ENABLED.
#
# No path filters: engineering, procurement, firmware and docs inputs all feed
# the published site and checks. Validation jobs never receive Cloudflare
# secrets. A green run is not an electronics or manufacturing approval.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit `shell: bash` runs steps with `bash --noprofile --norc -eo pipefail`,
# so a failing command piped into `tee` fails the step (the implicit default
# is `bash -e` without pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  # Exact Ubuntu 24.04 (noble) package used for the recorded A5 build:
  # "arm-none-eabi-gcc (15:13.2.rel1-2) 13.2.1 20231009". apt verifies it
  # against the signed Ubuntu archive.
  ARM_GCC_DEB_VERSION: "15:13.2.rel1-2"
  # Binutils that link the HEX/BIN; pinned so the image comparison is meaningful.
  ARM_BINUTILS_DEB_VERSION: "2.42-1ubuntu1+23"

jobs:
  a5-data:
    name: A5 data and record integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify 786 imported seed files (size + SHA-256)
        run: python3 scripts/verify_seed.py --manifest provenance/seed-manifest.json --repo . --output "$RUNNER_TEMP/seed-verification.json"
      - name: Recalculate procurement rows (frozen observations, --check)
        run: python3 engineering/a5/build_procurement_rows.py --check
      - name: Re-run netlist interface check (temporary output)
        run: >-
          python3 engineering/a5/integration/check_schematic_interfaces.py
          engineering/a5/integration/native_schematic/controller/netlist.xml
          engineering/a5/integration/native_schematic/led_leaf/netlist.xml
          engineering/a5/integration/native_schematic/power_adapter/netlist.xml
          --output "$RUNNER_TEMP/a5-interface-check.json"
      - name: BOM reconciliation, historical ERC/DRC input identities, firmware source manifest
        run: python3 scripts/check_a5_records.py --output "$RUNNER_TEMP/a5-record-checks.json"
      - name: Generated A5 pages and publication assets are current
        run: python3 scripts/a5_site.py generate --check
      - name: A5 catalog reconciliation current (30 identities / 71 placements / 81 pieces) and mutation tests
        run: |
          python3 scripts/a5_catalog.py reconcile --check
          python3 -m unittest -v scripts/test_a5_catalog.py
      - name: A7 R1 dimension study outputs current and focused evidence tests (paper study, not a fit approval)
        run: |
          python3 scripts/a7_dimension_study.py --check
          python3 -m unittest -v scripts/tests/test_a7_r1_study.py
      - name: Checkpoint left unmodified
        run: |
          python3 scripts/verify_seed.py --manifest provenance/seed-manifest.json --repo . > /dev/null
          git status --porcelain -- engineering/a5 | tee "$RUNNER_TEMP/a5-status.txt"
          test ! -s "$RUNNER_TEMP/a5-status.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo "### A5 data checks (fresh, this run)"
            echo "- Historical KiCad 10.0.8 ERC/DRC were **not** re-run; only their input identities were checked."
            echo "- Controller PCB remains UNROUTED (130 unconnected, 2 courtyard overlaps)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a5-data-reports
          path: |
            ${{ runner.temp }}/seed-verification.json
            ${{ runner.temp }}/a5-interface-check.json
            ${{ runner.temp }}/a5-record-checks.json
          retention-days: 3
          if-no-files-found: warn

  a7-mechanical:
    name: A7 mechanical layout and geometry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Standard library only: the CadQuery build is not re-run here; the tests compare the
      # committed CAD verification and front artwork records against the current layout.
      - name: A7 layout, layout.md and placement envelopes are current
        run: python3 scripts/a7_mechanical_layout.py --check
      - name: A7 R2 geometry tests (stack, candidates, keep-outs, routes, CAD/front records)
        run: python3 -m unittest -v scripts/tests/test_a7_r2_mechanical.py
      - name: A7 evidence and preparation negative controls (blocked reports remain valid)
        run: |
          python3 -m unittest scripts/tests/test_a7_e2_evidence.py scripts/tests/test_a7_fixture.py scripts/tests/test_a7_fixture_relief.py scripts/tests/test_a7_procurement.py scripts/tests/test_a7_readiness.py scripts/tests/test_a7_jlc_package.py scripts/tests/test_a7_panel.py
          python3 -O -m unittest scripts/tests/test_a7_readiness.py
          python3 scripts/a7_fixture.py --check
          python3 scripts/a7_fixture_geometry.py --check
          python3 scripts/a7_procurement.py --check
          python3 scripts/a7_readiness.py --check
          python3 scripts/a7_jlc_package.py --check
          python3 scripts/a7_panel.py --check
      - name: Summary
        if: always()
        run: echo "### A7 mechanical checks are a provisional digital study, not a fit approval or manufacturing release" >> "$GITHUB_STEP_SUMMARY"

  firmware-host:
    name: Firmware host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: cc --version | head -1; make --version | head -1
      - name: make test
        run: make -C engineering/a5/firmware test
      - name: make test-sanitize (ASan + UBSan + LeakSanitizer, no exclusions)
        run: make -C engineering/a5/firmware test-sanitize
      - name: make timing
        run: make -C engineering/a5/firmware timing
      - name: Checkpoint left unmodified (build/ is ignored)
        run: test -z "$(git status --porcelain -- engineering/a5)"

  firmware-arm:
    name: Firmware ARM build (temporary copy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned arm-none-eabi-gcc from the signed Ubuntu archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "gcc-arm-none-eabi=${ARM_GCC_DEB_VERSION}" "binutils-arm-none-eabi=${ARM_BINUTILS_DEB_VERSION}"
          test "$(dpkg-query -W -f='${Version}' gcc-arm-none-eabi)" = "$ARM_GCC_DEB_VERSION"
          test "$(dpkg-query -W -f='${Version}' binutils-arm-none-eabi)" = "$ARM_BINUTILS_DEB_VERSION"
          arm-none-eabi-gcc --version | head -1 | tee "$RUNNER_TEMP/arm-gcc-version.txt"
          grep -F "13.2.1 20231009" "$RUNNER_TEMP/arm-gcc-version.txt"
      - name: make arm (in tree; output to ignored build/)
        run: make -C engineering/a5/firmware arm
      - name: make_release.py in a temporary copy, compare with recorded dist/
        run: |
          work="$RUNNER_TEMP/fw"
          rm -rf "$work" && mkdir -p "$work"
          cp -a engineering/a5/firmware "$work/firmware"
          rm -rf "$work/firmware/build"
          python3 "$work/firmware/tools/make_release.py" --arm-prefix arm-none-eabi- | tee "$RUNNER_TEMP/make-release.txt"
          python3 - "$work/firmware/dist" engineering/a5/firmware/dist <<'PY' | tee "$RUNNER_TEMP/fw-compare.json"
          import hashlib, json, sys
          from pathlib import Path
          fresh, recorded = Path(sys.argv[1]), Path(sys.argv[2])
          v = json.loads((fresh / "verification.json").read_text())
          t = v["tests"]
          ok = (t["host"] == "PASS" and t["arm_compile_link"] == "PASS" and t["undefined_symbols"] == 0
                and all(x["strong_definition"] for x in t["interrupt_vectors"].values()))
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          images = {n: sha(fresh / n) == sha(recorded / n) for n in ("light_block_A5.hex", "light_block_A5.bin")}
          m = v["memory"]
          report = {"compiler": v["compiler"], "flash_payload_bytes": m["flash_payload_bytes"],
                    "static_plus_stack_bytes": m["static_plus_stack_bytes"],
                    "leak_sanitizer": t["leak_sanitizer"], "vectors": sorted(t["interrupt_vectors"]),
                    "undefined_symbols": t["undefined_symbols"], "release_checks_ok": ok,
                    "image_identical_to_recorded_dist": images,
                    "note": "ELF/MAP embed build paths and are not compared; HEX/BIN are the flashable images."}
          print(json.dumps(report, indent=2))
          sys.exit(0 if ok and all(images.values()) else 1)
          PY
      - name: Original dist/ and seed identities unchanged
        run: |
          python3 scripts/verify_seed.py --manifest provenance/seed-manifest.json --repo . > /dev/null
          test -z "$(git status --porcelain -- engineering/a5)"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Firmware ARM build (fresh, this run)"
            echo '```'; cat "$RUNNER_TEMP/arm-gcc-version.txt" 2>/dev/null; cat "$RUNNER_TEMP/fw-compare.json" 2>/dev/null; echo '```'
            echo "No flashing or hardware test is performed."
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs build, site checks, browser, Cloudflare dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: circuit:doctor
        run: pnpm circuit:doctor
      - name: circuit:check
        run: pnpm circuit:check
      - name: A5 catalog consistency (inventory, bundles, pin maps, selection vs reconciliation)
        run: python3 scripts/a5_catalog.py check
      - name: circuit:generate + A5 generation leave no tracked changes
        run: |
          pnpm circuit:generate
          python3 scripts/a5_site.py generate
          git status --porcelain --untracked-files=all -- . ':!doc/public/a5' | tee "$RUNNER_TEMP/drift.txt"
          test ! -s "$RUNNER_TEMP/drift.txt"
      - name: build
        run: pnpm build
      - name: check (evidence, generated output current, tsc)
        run: pnpm check
      - name: check:site (built references, publication scope, links, size/count limits)
        run: pnpm check:site
      - name: Second build introduces no tracked changes
        run: |
          pnpm build
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/drift2.txt"
          test ! -s "$RUNNER_TEMP/drift2.txt"
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Authored-site and component-catalog browser checks (desktop + mobile)
        run: pnpm test:browser
      - name: Framework check-browser (explicit representatives; exit 4 is not a pass)
        run: |
          CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")" pnpm test:browser:framework | tee "$RUNNER_TEMP/check-browser.txt"
          grep -q "viewport/theme navigations" "$RUNNER_TEMP/check-browser.txt"
      - name: Cloudflare Build Output (no credentials)
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        run: |
          pnpm --dir doc exec cf --version
          pnpm cf:build
          pnpm cf:check-output
          pnpm cf:dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: test-results/screenshots/
          retention-days: 3
          if-no-files-found: warn

  native-infrastructure:
    name: Native gate infrastructure (fixtures, KiCad 10.0.8)
    # Exercises scripts/native_gate on routed fixtures with negative controls and the immutable
    # A5 controller as an expected-failure control. INFRASTRUCTURE_PASS is never an A7 board result;
    # the A7 board result comes only from the A7 revision profile run on the committed candidate.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Digest-pinned KiCad 10.0.8 (amd64); the gate refuses to run if the profile names another image.
      KICAD_IMAGE: kicad/kicad:10.0.8@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34
      PROFILE: scripts/tests/fixtures/native/profile.json
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Failure receipt (before any long work), image and lock checks
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/native-receipt"
          printf '{"status":"STARTED_INCOMPLETE","sha":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/native-receipt/receipt.json"
          test "$(python3 -c 'import json,os;print(json.load(open(os.environ["PROFILE"]))["image"])')" = "$KICAD_IMAGE"
          test "$(python3 -c 'import json;print(json.load(open("engineering/a7/verification/native_gate.json"))["image"])')" = "$KICAD_IMAGE"
          python3 scripts/native_gate/runner.py lock --profile "$PROFILE" --check
          python3 scripts/native_gate/runner.py lock --profile engineering/a7/verification/native_gate.json --check
      - name: Gate guard tests (normal and python -O)
        timeout-minutes: 2
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_native_*.py'
          python3 -O -m unittest discover -s scripts/tests -p 'test_native_*.py'
      - name: Pull digest-pinned KiCad image
        timeout-minutes: 4
        run: |
          docker pull "$KICAD_IMAGE"
          docker image inspect "$KICAD_IMAGE" --format '{{json .RepoDigests}} {{.Architecture}}' | tee "$RUNNER_TEMP/native-receipt/image.txt"
      - name: A7 schematic phase check (fresh ERC, netlist, staging parity, interface, delta; not a board result)
        timeout-minutes: 8
        run: |
          python3 scripts/a7_electronics.py generate --check
          python3 scripts/a7_schematic_check.py --out "$RUNNER_TEMP/a7-schematic"
          s="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/a7-schematic/summary.json")"
          echo "### A7 schematic phase: $s (schematic only, not a board result)" >> "$GITHUB_STEP_SUMMARY"
          test -z "$(docker ps -aq --filter label=zudo-led-block.a7-schematic)"
      - name: Native infrastructure run (ERC, netlists, parity, DRC, refill, interface, delta, controls)
        timeout-minutes: 12
        run: python3 scripts/native_gate/runner.py run --profile "$PROFILE" --out "$RUNNER_TEMP/native" --deadline-s 660
      - name: A7 controller board gate on the committed candidate (ERC, parity, DRC, unconnected, refill, regeneration, controls)
        timeout-minutes: 12
        run: |
          python3 scripts/native_gate/runner.py run --profile engineering/a7/verification/native_gate.json --out "$RUNNER_TEMP/a7-gate" --deadline-s 660
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/a7-gate/summary.json")" = PASS
      - name: A7 router reproducibility (seed 0 equals the recorded route, board carries it) and review-aid export
        timeout-minutes: 10
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-router.txt
          python3 scripts/a7_route_check.py --out "$RUNNER_TEMP/a7-route-check" --review-aid
      - name: Upload review aid (Gerber, drill, positions; NOT a release output, not for ordering)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a7-controller-review-aid-NOT-A-RELEASE
          path: ${{ runner.temp }}/a7-route-check/review-aid/
          retention-days: 7
          if-no-files-found: error
      - name: JLC order-package dry-run export (Gerber, drill, CPL vs KiCad positions; NOT order files)
        timeout-minutes: 6
        run: python3 scripts/a7_jlc_package.py export --out "$RUNNER_TEMP/jlc-package-dry-run"
      - name: Upload JLC package dry run (NOT a release, not for ordering)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jlc-package-DRY-RUN-NOT-FOR-ORDER
          path: ${{ runner.temp }}/jlc-package-dry-run/
          retention-days: 7
          if-no-files-found: error
      - name: Repo-built JLC assembly panels (board identity, outline, drills, panel DRC, CPL vs KiCad; prepared route, NOT order files)
        timeout-minutes: 8
        run: python3 scripts/a7_panel.py build --out "$RUNNER_TEMP/a7-panels"
      - name: Upload repo panels (prepared route, NOT a release, not for ordering)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a7-repo-panels-PREPARED-NOT-FOR-ORDER
          path: |
            ${{ runner.temp }}/a7-panels/*.zip
            ${{ runner.temp }}/a7-panels/summary.json
            ${{ runner.temp }}/a7-panels/README-PREPARED-ROUTE-NOT-FOR-ORDER.txt
          retention-days: 7
          if-no-files-found: error
      - name: A7 bonded PET leaf profile and interface check (A5 leaf circuit and copper; not a PET approval)
        timeout-minutes: 10
        run: python3 scripts/a7_pet_leaf_check.py --out "$RUNNER_TEMP/a7-pet-leaf"
      - name: Checkpoint and fixtures left unmodified, no owned container left
        if: always()
        timeout-minutes: 1
        run: |
          python3 scripts/verify_seed.py --manifest provenance/seed-manifest.json --repo . > /dev/null
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/native-receipt/status.txt"
          test ! -s "$RUNNER_TEMP/native-receipt/status.txt"
          test -z "$(docker ps -aq --filter label=zudo-led-block.native-gate)"
          test -z "$(docker ps -aq --filter label=zudo-led-block.a7-route-check)"
          test -z "$(docker ps -aq --filter label=zudo-led-block.a7-pet-leaf-check)"
          test -z "$(docker ps -aq --filter label=zudo-led-block.a7-jlc-package)"
          test -z "$(docker ps -aq --filter label=zudo-led-block.a7-panel)"
      - name: Summary
        if: always()
        timeout-minutes: 1
        run: |
          python3 - "$RUNNER_TEMP/native/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except (OSError, ValueError) as e:
              print(f"### Native gate infrastructure: NO SUMMARY ({e}) - treated as failure"); sys.exit(0)
          print(f"### Native gate infrastructure (fresh, this run): {s.get('status')}")
          print(f"- Board result: {s.get('board_result')}")
          print(f"- Image: `{s.get('image')}`")
          for n, r in (s.get('results', {}).get('designs') or {}).items():
              print(f"- `{n}`: {'PASS' if r.get('ok') else 'FAIL'} {json.dumps(r.get('facts', {}).get('parity_classes', {}))}")
          for n, r in (s.get('results', {}).get('controls') or {}).items():
              print(f"- control `{n}`: {'detected/as expected' if r.get('ok') else 'NOT DEMONSTRATED'}")
          for f in s.get('failures', [])[:30]:
              print(f"  - FAIL: {f}")
          print("A green infrastructure run is not an A7 board result, nor an electronics or manufacturing approval.")
          PY
          python3 - "$RUNNER_TEMP/a7-gate/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except (OSError, ValueError) as e:
              print(f"### A7 controller board gate: NO SUMMARY ({e}) - treated as failure"); sys.exit(0)
          print(f"### A7 controller board gate (fresh, this run): {s.get('status')} ({s.get('board_result')})")
          for n, r in (s.get('results', {}).get('controls') or {}).items():
              print(f"- control `{n}`: {'detected/as expected' if r.get('ok') else 'NOT DEMONSTRATED'}")
          for f in s.get('failures', [])[:30]:
              print(f"  - FAIL: {f}")
          print("A passing A7 board gate is a digital check only: no physical fit, bench or manufacturing release.")
          PY
          python3 - "$RUNNER_TEMP/a7-route-check/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except (OSError, ValueError) as e:
              print(f"### A7 router reproducibility: NO SUMMARY ({e}) - treated as failure"); sys.exit(0)
          print(f"### A7 router reproducibility (seed 0, fresh): {s.get('status')}")
          print(f"- recorded route reproduced byte for byte: {s.get('proposal_reproduced')}")
          for k, v in (s.get('board_copper_vs_proposal') or {}).items():
              print(f"- board {k} equal to the recorded route: {v.get('equal')} ({v.get('board')} vs {v.get('proposal')})")
          for f in s.get('failures', [])[:20]:
              print(f"  - FAIL: {f}")
          print("The review-aid artifact (Gerber, drill, positions) is not a release output and must not be ordered from.")
          PY
          python3 - "$RUNNER_TEMP/a7-pet-leaf/summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              s = json.load(open(sys.argv[1]))
          except (OSError, ValueError) as e:
              print(f"### A7 bonded PET leaf check: NO SUMMARY ({e}) - treated as failure"); sys.exit(0)
          print(f"### A7 bonded PET leaf profile and interface check: {s.get('status')}")
          for k, v in (s.get('verdicts') or {}).items():
              print(f"- {k}: {v}")
          for f in s.get('failures', [])[:20]:
              print(f"  - FAIL: {f}")
          print("NOT_MET is a finding about the PET variant. FR-4 stays the default leaf; this is not a PET approval or a manufacturing release.")
          PY
      - name: Final receipt (replaces STARTED_INCOMPLETE with the gate's own final status)
        if: always()
        timeout-minutes: 1
        run: |
          python3 - "$RUNNER_TEMP/native/summary.json" "$RUNNER_TEMP/native-receipt/receipt.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          try:
              status = json.load(open(sys.argv[1])).get('status', 'NO_STATUS')
          except (OSError, ValueError):
              status = 'NO_SUMMARY_INCOMPLETE'
          json.dump({'status': status, 'sha': sys.argv[3], 'source': 'native/summary.json'}, open(sys.argv[2], 'w'))
          print(status)
          PY
      - name: A7 candidate evidence retained and bound (staged upload set; failure evidence is never a pass)
        # Narrow allowlist: summary, plan, candidate board facts and geometry. The infrastructure
        # receipt above is not an A7 candidate result; this record classifies the candidate set only.
        if: always()
        timeout-minutes: 1
        env:
          EXPECT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/a7_native_artifact.py --dir "$RUNNER_TEMP"
          --expect-revision "$EXPECT_REVISION" --expect-checkout "$GITHUB_SHA"
          --expect-run-id "$GITHUB_RUN_ID" --expect-run-attempt "$GITHUB_RUN_ATTEMPT"
          --out "$RUNNER_TEMP/native-receipt/a7-candidate-evidence.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 2
        with:
          name: native-infrastructure-evidence
          path: |
            ${{ runner.temp }}/native-receipt/
            ${{ runner.temp }}/native/summary.json
            ${{ runner.temp }}/native/plan.json
            ${{ runner.temp }}/native/evidence/
            ${{ runner.temp }}/a7-gate/summary.json
            ${{ runner.temp }}/a7-gate/plan.json
            ${{ runner.temp }}/a7-gate/evidence/a7_controller/board_facts.json
            ${{ runner.temp }}/a7-gate/evidence/a7_controller/board_geometry.json
            ${{ runner.temp }}/a7-gate/evidence/a7_controller/fixture_geometry.json
            ${{ runner.temp }}/a7-schematic/summary.json
            ${{ runner.temp }}/a7-route-check/summary.json
            ${{ runner.temp }}/a7-pet-leaf/summary.json
          retention-days: 7
          if-no-files-found: warn

  deploy-gate:
    name: Deploy gate
    needs: [a5-data, a7-mechanical, firmware-host, firmware-arm, docs, native-infrastructure]
    # Always report, including when a validation job failed (then deploy is skipped).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report production deployment state
        env:
          VALIDATION: ${{ join(needs.*.result, ' ') }}
          ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          valid=true
          for r in $VALIDATION; do [ "$r" = "success" ] || valid=false; done
          if [ "$valid" != true ]; then
            msg="Production deploy SKIPPED: validation did not succeed (results: $VALIDATION). Nothing was deployed."
          elif [ "$REPO" = "Takazudo/zudo-led-block" ] && [ "$REF" = "refs/heads/main" ] \
             && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; } && [ "$ENABLED" = "true" ]; then
            msg="Production deploy ENABLED for this revision; see the Production deploy job for the outcome (CLOUDFLARE_DEPLOY_ENABLED=true)."
          else
            msg="Production deploy DISABLED / SKIPPED (requires Takazudo/zudo-led-block, refs/heads/main, push or workflow_dispatch, and CLOUDFLARE_DEPLOY_ENABLED == 'true'; event=$EVENT ref=$REF). Nothing was deployed."
          fi
          echo "$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"

  production-deploy:
    name: Production deploy
    needs: [a5-data, a7-mechanical, firmware-host, firmware-arm, docs, native-infrastructure]
    if: >-
      github.repository == 'Takazudo/zudo-led-block' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://zudo-led-block.zudolab.dev/
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Require Cloudflare credentials (values are never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_ENABLED is 'true' but these secrets are missing:$missing. See doc/src/content/docs/project/hosting.mdx."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build docs and Cloudflare Build Output for this revision
        run: |
          pnpm build
          pnpm check:site
          pnpm cf:build
          pnpm cf:check-output
      - name: cf deploy --prebuilt (mode exactly as recorded in Build Output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mode="$(python3 scripts/check_cf_output.py doc/.cloudflare/output/v0 --print-mode)"
          if [ -n "$mode" ]; then
            pnpm --dir doc exec cf deploy --prebuilt --mode "$mode" --message "${GITHUB_SHA}"
          else
            pnpm --dir doc exec cf deploy --prebuilt --message "${GITHUB_SHA}"
          fi
