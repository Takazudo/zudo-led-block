packages: [ "doc" ]
# pnpm 11 defaults minimumReleaseAge to 1440min. The exclude matcher can't
# match a fresh install's peer-nested lockfile keys (upstream pnpm bug), the
# same reason create-zudo-doc 9.1.3's own scaffold disables the gate
# outright instead of excluding specific packages. Revisit once that's fixed
# and this project is ready to publish.
minimumReleaseAge: 0
allowBuilds:
  esbuild: true
  # Cloudflare local runtime used by cf/wrangler (doc/); its postinstall only
  # verifies the platform binary from an optional dependency.
  workerd: true
patchedDependencies:
  '@takazudo/zudo-circuit-doc@0.3.0': patches/@takazudo__zudo-circuit-doc@0.3.0.patch
